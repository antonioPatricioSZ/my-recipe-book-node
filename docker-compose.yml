services:
  postgres:
    container_name: my-recipe-book-node
    image: postgres
    ports:
      - 5433:5432 # usa 5433 na máquina host
    environment:
      POSTGRES_USER: patricio
      POSTGRES_PASSWORD: patricio123
      POSTGRES_DB: my-recipe-book-node
      PGDATA: /data/postgres
    volumes:
      - ./data/pg:/data/postgres
